[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "highspeed-uuv-kinematic"
version = "0.1.0"
description = "Speed-constrained kinematic UUV planning and validation"
requires-python = ">=3.10"
dependencies = [
  "gymnasium",
  "numpy",
  "matplotlib",
  "stable-baselines3",
  "torch",
]

[tool.setuptools.packages.find]
include = ["kinematic_uuv*", "training*"]

